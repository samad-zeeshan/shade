<!doctype html>
<!-- One page that plays back the precomputed shade schedule from data.json. Visible text is filled in by copy() in app.js. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shade</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%231a1a18'/%3E%3Cpath d='M8 2a6 6 0 0 1 0 12z' fill='%232c6e9b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400..500&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="mark">shade</span>
      <span class="site" id="site"></span>
    </div>
    <div class="seg" role="radiogroup" id="scenarios"></div>
  </header>

  <main class="body">
    <section class="mapwrap">
      <div id="map"></div>
      <svg class="compass" id="compass" viewBox="-40 -40 80 80" aria-hidden="true">
        <circle r="30" class="ring"/>
        <g id="compass-rose">
          <line y1="-30" y2="-24" class="tick"/><line y1="24" y2="30" class="tick"/>
          <line x1="-30" x2="-24" class="tick"/><line x1="24" x2="30" class="tick"/>
          <text y="-33" class="nlabel">N</text>
          <g id="sun-tick"><line y1="-30" y2="-14" class="sunline"/><circle cy="-30" r="3" class="sundot"/></g>
        </g>
      </svg>
      <div class="titleblock" id="titleblock">
        <div class="tb-row"><span class="tb-k" data-copy="tbTime"></span><span class="tb-v mono" id="tb-time"></span></div>
        <div class="tb-row"><span class="tb-k" data-copy="tbSun"></span><span class="tb-v mono" id="tb-sun"></span></div>
        <div class="tb-row"><span class="tb-k" data-copy="tbAir"></span><span class="tb-v mono" id="tb-air"></span></div>
        <div class="tb-row"><span class="tb-k" data-copy="tbHeat"></span><span class="tb-v mono" id="tb-heat"></span></div>
      </div>
      <div class="legend">
        <p data-copy="mapKeyShadow"></p>
        <p data-copy="mapKeyDots"></p>
        <div class="ramp"><span class="mono" data-copy="rampLo"></span><i></i><span class="mono" data-copy="rampHi"></span></div>
      </div>
      <div class="tip" id="tip" hidden></div>
    </section>

    <section class="panel">
      <p class="pitch" id="pitch"></p>
      <div class="kpis" id="kpis"></div>
      <div class="tl-head">
        <h2 data-copy="tlTitle"></h2>
        <p class="tl-key">
          <span><i class="sw ban"></i><span data-copy="keyBan"></span></span>
          <span><i class="sw ot"></i><span data-copy="keyOvertime"></span></span>
          <span><i class="sw viol"></i><span data-copy="keyViolation"></span></span>
        </p>
      </div>
      <div class="tl" id="tl"></div>
    </section>
  </main>

  <footer class="scrub">
    <button class="play" id="play" type="button"></button>
    <div class="clock mono" id="clock"></div>
    <div class="track" id="track" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="59">
      <div class="ticks" id="ticks"></div>
      <div class="rail"><div class="thumb" id="thumb"></div></div>
      <div class="strip" id="strip"></div>
    </div>
    <p class="strip-note" data-copy="stripNote"></p>
  </footer>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
